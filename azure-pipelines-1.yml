trigger:
- main

pool:
  name: 'Pool Agent'   # safer than custom pool unless required

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'

stages:

# =====================================
# STAGE 1 - BUILD
# =====================================
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish Web Project
    - task: DotNetCoreCLI@2
      displayName: 'Publish Web Project'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Debug - Confirm ZIP exists
    - script: |
        echo "Listing Artifact Staging Directory"
        dir $(Build.ArtifactStagingDirectory) /s
      displayName: 'Debug - List Artifacts'

    # Publish Pipeline Artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'


# =====================================
# STAGE 2 - DEPLOY TO PRODUCTION
# =====================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: succeeded()
  jobs:

  - job: DeployProductionJob
    displayName: 'Deploy to Production'
    steps:

    # Download artifact
    - download: current
      artifact: build

    # Debug - Confirm artifact downloaded
    - script: |
        echo "Listing Pipeline Workspace"
        dir $(Pipeline.Workspace) /s
      displayName: 'Debug - List Downloaded Artifact'

    # Deploy to Azure App Service staging slot
    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy to Staging Slot'
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        WebAppName: 'dssdemo1-prod'
        deployToSlotOrASE: true
        ResourceGroupName: 'DemoRG'
        SlotName: 'staging'
        packageForLinux: '$(Pipeline.Workspace)/build/*.zip'

    # Swap slots
    - task: AzureAppServiceManage@0
      displayName: 'Swap Staging to Production'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'dssdemo1-prod'
        ResourceGroupName: 'DemoRG'
        SourceSlot: 'staging'