trigger:
- main

pool:
  name: 'Pool Agent'   # Use Microsoft hosted agent

variables:
  buildConfiguration: 'Release'

stages:

# =====================================
# STAGE 1 - BUILD
# =====================================
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore and Build'
    steps:

    # Ensure repo is checked out
    - checkout: self

    # Show files (helps debugging if path issues occur)
    - script: |
        echo "Listing source directory contents"
        dir $(Build.SourcesDirectory) /s
      displayName: 'Debug - List files'

    # Install .NET SDK (safe for .NET Core / .NET 6+)
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish
    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    # Publish artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'


# =====================================
# STAGE 2 - DEPLOY TO QA
# =====================================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:

  - job: DeployQAJob
    displayName: 'Deploy to QA'
    steps:
    - script: |
        echo "Deploying to QA environment..."
      displayName: 'Run QA deployment commands'

  - job: WaitForValidation
    displayName: 'Manual Approval'
    dependsOn: DeployQAJob
    pool: server
    timeoutInMinutes: 4320
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          DiphokoS@nra.co.za
          Mafaralalam@nra.co.za
        instructions: 'Please validate QA deployment before Production.'
        onTimeout: 'reject'


# =====================================
# STAGE 3 - DEPLOY TO PRODUCTION
# =====================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()
  jobs:

  - job: DeployProductionJob
    displayName: 'Deploy to Production'
    steps:
    - script: |
        echo "Deploying to Production environment..."
      displayName: 'Run production deployment commands'


# =====================================
# STAGE 4 - ROLLBACK (If Production Fails)
# =====================================
- stage: Rollback
  displayName: 'Rollback Stage'
  dependsOn: DeployToProduction
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Rollback Deployment'
    steps:
    - script: |
        echo "Rolling back production deployment..."
      displayName: 'Run rollback commands'
