trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'  # Use exact service connection name

stages:

# =====================================
# STAGE 1 - BUILD
# =====================================
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore dependencies
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build solution
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish web projects to artifact staging directory
    - task: DotNetCoreCLI@2
      displayName: 'Publish Web Project'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Debug - list published artifacts
    - script: |
        echo "Listing Artifact Staging Directory contents:"
        dir $(Build.ArtifactStagingDirectory) /s
      displayName: 'Debug - List Artifacts'

    # Publish build artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'

# =====================================
# STAGE 2 - DEPLOY TO QA
# =====================================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:

  - job: DeployQAJob
    displayName: 'Deploy to QA'
    steps:

    # Download artifact
    - download: current
      artifact: build

    # Debug - list downloaded artifacts
    - script: |
        echo "Listing downloaded build artifact in QA stage:"
        dir $(Pipeline.Workspace)/build /s
      displayName: 'Debug - List Downloaded Artifact'

    # Placeholder for QA deployment commands
    - script: |
        echo "Deploying to QA environment..."
      displayName: 'Run QA deployment commands'

  - job: WaitForValidation
    displayName: 'Manual Approval'
    dependsOn: DeployQAJob
    pool: server
    timeoutInMinutes: 4320
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          DiphokoS@nra.co.za
          Mafaralalam@nra.co.za
        instructions: 'Please validate QA deployment before Production.'
        onTimeout: 'reject'

# =====================================
# STAGE 3 - DEPLOY TO PRODUCTION
# =====================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()
  jobs:

  - job: DeployProductionJob
    displayName: 'Deploy to Production'
    steps:

    # Download artifact
    - download: current
      artifact: build

    # Debug - confirm artifact
    - script: |
        echo "Listing downloaded build artifact in Production stage:"
        dir $(Pipeline.Workspace)/build /s
      displayName: 'Debug - List Downloaded Artifact'

    # Deploy to staging slot
    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy to Staging Slot'
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        WebAppName: 'Microsoft Azure Enterprise_SANRALHO'
        deployToSlotOrASE: true
        ResourceGroupName: 'Microsoft Azure Enterprise_SANRALHO'
        SlotName: 'staging'
        packageForLinux: '$(Pipeline.Workspace)/build/*.zip'

    # Swap staging slot to production
    - task: AzureAppServiceManage@0
      displayName: 'Swap Staging to Production'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'Microsoft Azure Enterprise_SANRALHO'
        ResourceGroupName: 'Microsoft Azure Enterprise_SANRALHO'
        SourceSlot: 'staging'

# =====================================
# STAGE 4 - ROLLBACK (If Production Fails)
# =====================================
- stage: Rollback
  displayName: 'Rollback Stage'
  dependsOn: DeployToProduction
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Rollback Deployment'
    steps:

    - script: |
        echo "Rolling back production deployment..."
      displayName: 'Start Rollback'

    - task: AzureAppServiceManage@0
      displayName: 'Swap Back to Staging'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'Microsoft Azure Enterprise_SANRALHO'
        ResourceGroupName: 'Microsoft Azure Enterprise_SANRALHO'
        SourceSlot: 'production'