trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'

# =====================================
# STAGE 1 - BUILD
# =====================================
stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    # Install .NET SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish
    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Publish artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'

# =====================================
# STAGE 2 - DEPLOY TO QA
# =====================================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployQAJob
    steps:

    - download: current
      artifact: build

    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy to QA Slot'
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        WebAppName: 'DevOpsDev'
        ResourceGroupName: 'DevOps'
        deployToSlotOrASE: true
        SlotName: 'staging'
        packageForLinux: '$(Pipeline.Workspace)/build/*.zip'

# =====================================
# STAGE 3 - DEPLOY TO PRODUCTION
# =====================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()
  jobs:
  - job: DeployProductionJob
    steps:

    - download: current
      artifact: build

    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy to Production Staging Slot'
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        WebAppName: 'Microsoft Azure Enterprise_SANRALHO'
        ResourceGroupName: 'DevOps'
        deployToSlotOrASE: true
        SlotName: 'staging'
        packageForLinux: '$(Pipeline.Workspace)/build/*.zip'

    - task: AzureAppServiceManage@0
      displayName: 'Swap Staging to Production'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'DevOpsDev'
        ResourceGroupName: 'DevOps'
        SourceSlot: 'staging'

# =====================================
# STAGE 4 - ROLLBACK
# =====================================
- stage: Rollback
  displayName: 'Rollback'
  dependsOn: DeployToProduction
  condition: failed()
  jobs:
  - job: RollbackJob
    steps:

    - task: AzureAppServiceManage@0
      displayName: 'Swap Back to Staging'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'DevOpsDev'
        ResourceGroupName: 'DevOps'
        SourceSlot: 'production'