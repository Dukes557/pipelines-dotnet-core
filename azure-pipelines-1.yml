trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'     # Must match service connection name exactly
  webAppName: 'DevopsDevWebApp'        # Your App Service name
  resourceGroupName: 'Your-Resource-Group'  # <-- CHANGE THIS

# =====================================================
# STAGE 1 - BUILD
# =====================================================
stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2 - DEPLOY TO STAGING SLOT
# =====================================================
- stage: DeployToStaging
  displayName: 'Deploy to Staging Slot'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy to Staging Environment'
    environment: 'Staging'
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: build

          - task: AzureWebApp@1
            displayName: 'Deploy to Staging Slot'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webApp'
              appName: $(webAppName)
              deployToSlotOrASE: true
              resourceGroupName: $(resourceGroupName)
              slotName: 'staging'
              package: '$(Pipeline.Workspace)/build/**/*.zip'

# =====================================================
# STAGE 3 - SWAP STAGING TO PRODUCTION
# =====================================================
- stage: SwapToProduction
  displayName: 'Swap Staging to Production'
  dependsOn: DeployToStaging
  condition: succeeded()

  jobs:
  - deployment: SwapSlots
    displayName: 'Swap Slots'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureAppServiceManage@0
            displayName: 'Swap Staging -> Production'
            inputs:
              azureSubscription: $(azureServiceConnection)
              Action: 'Swap Slots'
              WebAppName: $(webAppName)
              ResourceGroupName: $(resourceGroupName)
              SourceSlot: 'staging'

# =====================================================
# STAGE 4 - ROLLBACK (MANUAL APPROVAL VIA ENVIRONMENT)
# =====================================================
- stage: Rollback
  displayName: 'Rollback Production'
  dependsOn: []
  condition: succeeded()

  jobs:
  - deployment: RollbackDeployment
    displayName: 'Rollback via Slot Swap'
    environment: 'Production'   # Add approval here in Azure DevOps UI
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureAppServiceManage@0
            displayName: 'Swap Production Back to Staging'
            inputs:
              azureSubscription: $(azureServiceConnection)
              Action: 'Swap Slots'
              WebAppName: $(webAppName)
              ResourceGroupName: $(resourceGroupName)
              SourceSlot: 'staging'