trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'   # MUST match Service Connection name exactly

# =====================================================
# STAGE 1 - BUILD
# =====================================================
stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish (Creates ZIP automatically)
    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Publish pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2 - DEPLOY TO QA (Staging Slot)
# =====================================================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployQAJob
    displayName: 'Deploy to QA Slot'
    steps:

    - download: current
      artifact: build

    - task: AzureWebApp@1
      displayName: 'Deploy to QA Staging Slot'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        appName: 'DevopsDevWebApp'
        deployToSlotOrASE: true
        slotName: 'staging'
        package: '$(Pipeline.Workspace)/build/*.zip'

# =====================================================
# STAGE 3 - DEPLOY TO PRODUCTION
# =====================================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()

  jobs:
  - job: DeployProductionJob
    displayName: 'Swap to Production'
    steps:

    - task: AzureAppServiceManage@0
      displayName: 'Swap Staging Slot to Production'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'DevopsDevWebApp'
        ResourceGroupName: 'DevOps'
        SourceSlot: 'staging'

# =====================================================
# STAGE 4 - ROLLBACK (If Production Fails)
# =====================================================
- stage: Rollback
  displayName: 'Rollback'
  dependsOn: DeployToProduction
  condition: failed()

  jobs:
  - job: RollbackJob
    displayName: 'Rollback to Previous Version'
    steps:

    - task: AzureAppServiceManage@0
      displayName: 'Swap Back to Staging'
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: 'Swap Slots'
        WebAppName: 'DevopsDevWebApp'
        ResourceGroupName: 'DevOps'
        SourceSlot: 'production'