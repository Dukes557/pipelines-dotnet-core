trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'DevOps'   # Must match Service Connection name exactly

# =====================================================
# STAGE 1 - BUILD
# =====================================================
stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish (Creates ZIP automatically)
    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Publish Pipeline Artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2 - DEPLOY TO PRODUCTION
# =====================================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployProductionJob
    displayName: 'Deploy to Azure App Service'
    steps:

    - download: current
      artifact: build

    - task: AzureWebApp@1
      displayName: 'Deploy Web App'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appType: 'webApp'
        appName: 'DevopsDevWebApp'
        package: '$(Pipeline.Workspace)/build/*.zip'