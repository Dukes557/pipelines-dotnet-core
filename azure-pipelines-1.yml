trigger:
- main

pool:
  name: 'Pool Agent'   # Use Microsoft hosted agent

variables:
  buildConfiguration: 'Release'

stages:

# =====================================
# STAGE 1 - BUILD
# =====================================
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Restore, Build & Publish'
    steps:

    - checkout: self

    - script: |
        echo "Listing source directory contents"
        dir $(Build.SourcesDirectory) /s
      displayName: 'Debug - List files'

    # Install .NET 8 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'
        installationPath: $(Agent.ToolsDirectory)/dotnet

    # Restore
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # Build
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Publish (Zip for deployment)
    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Publish artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'build'
        publishLocation: 'pipeline'


# =====================================
# STAGE 2 - DEPLOY TO QA
# =====================================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:

  - job: DeployQAJob
    displayName: 'Deploy to QA'
    steps:
    - script: |
        echo "Deploying to QA environment..."
      displayName: 'Run QA deployment commands'

  - job: WaitForValidation
    displayName: 'Manual Approval'
    dependsOn: DeployQAJob
    pool: server
    timeoutInMinutes: 4320
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          DiphokoS@nra.co.za
          Mafaralalam@nra.co.za
        instructions: 'Please validate QA deployment before Production.'
        onTimeout: 'reject'


# =====================================
# STAGE 3 - DEPLOY TO PRODUCTION
# =====================================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()
  jobs:

  - job: DeployProductionJob
    displayName: 'Deploy to Production'
    steps:

    # Download artifact from Build stage
    - download: current
      artifact: build

    - script: |
        echo "Deploying to Production environment..."
      displayName: 'Start Production Deployment'

    # Deploy to staging slot
    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy to Staging Slot'
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: 'DevOps'
        appType: 'webApp'
        WebAppName: 'dssdemo1-prod'
        deployToSlotOrASE: true
        ResourceGroupName: 'DemoRG'
        SlotName: 'staging'
        packageForLinux: '$(Pipeline.Workspace)/build/**/*.zip'

    # Swap staging slot to production
    - task: AzureAppServiceManage@0
      displayName: 'Swap Staging to Production'
      inputs:
        azureSubscription: 'DevOps'
        Action: 'Swap Slots'
        WebAppName: 'dssdemo1-prod'
        ResourceGroupName: 'DemoRG'
        SourceSlot: 'staging'


# =====================================
# STAGE 4 - ROLLBACK (If Production Fails)
# =====================================
- stage: Rollback
  displayName: 'Rollback Stage'
  dependsOn: DeployToProduction
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Rollback Deployment'
    steps:

    - script: |
        echo "Rolling back production deployment..."
      displayName: 'Start Rollback'

    - task: AzureAppServiceManage@0
      displayName: 'Swap Back to Staging'
      inputs:
        azureSubscription: 'DevOps'
        Action: 'Swap Slots'
        WebAppName: 'dssdemo1-prod'
        ResourceGroupName: 'DemoRG'
        SourceSlot: 'production'