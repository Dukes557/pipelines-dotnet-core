trigger:
- main

pool:
  name: 'Pool Agent'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:

# ========================
# STAGE 1 - Build
# ========================
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Build Solution'
    steps:

    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        vsVersion: '17.0'     # VS 2022
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        clean: true

    - task: VSTest@2
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)'
        artifact: 'build'
        publishLocation: 'pipeline'


# ========================
# STAGE 2 - Deploy to QA
# ========================
- stage: DeployToQA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:

  - job: DeployQAJob
    displayName: 'Deploy to QA Job'
    steps:
    - script: |
        echo "Deploying to QA..."
      displayName: 'Run QA deployment commands'

  - job: WaitForValidation
    displayName: 'Wait for external validation'
    dependsOn: DeployQAJob
    pool: server
    timeoutInMinutes: 4320
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          DiphokoS@nra.co.za
          Mafaralalam@nra.co.za
        instructions: 'Please validate the build configuration and resume'
        onTimeout: 'reject'


# ========================
# STAGE 3 - Deploy to Production
# ========================
- stage: DeployToProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployToQA
  condition: succeeded()
  jobs:

  - job: DeployProductionJob
    displayName: 'Deploy to Production Job'
    steps:
    - script: |
        echo "Deploying to production..."
      displayName: 'Run production deployment commands'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish pipeline artifact'
      inputs:
        targetPath: '$(Pipeline.Workspace)'
        artifact: 'prod'
        publishLocation: 'pipeline'


# ========================
# STAGE 4 - Rollback
# ========================
- stage: Rollback
  displayName: 'Rollback Stage'
  dependsOn: DeployToProduction
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Rollback Job'
    steps:
    - script: |
        echo "Rolling back the deployment..."
      displayName: 'Run rollback commands'
